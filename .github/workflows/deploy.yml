name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      keep_images:
        description: 'How many images of each repo to keep on the swarm node (for rollback)'
        required: false
        default: '3'
      prune_registry:
        description: 'Also delete old tags from Yandex Container Registry'
        type: boolean
        required: false
        default: false

# One deploy at a time — two overlapping `docker stack deploy` runs against the
# same swarm would fight over the rolling update.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-core:
    name: Build & push core
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Yandex Cloud CR Login
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push core image
        env:
          CR_HOST: ${{ secrets.CR_HOST }}
          CR_REGISTRY: ${{ secrets.CR_REGISTRY }}
          CR_IMAGE: ${{ secrets.CR_IMAGE_CORE }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG" \
            -t "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:latest" \
            ./apps/core

          docker push "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG"
          docker push "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:latest"

  push-client:
    name: Build & push client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Yandex Cloud CR Login
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push client image
        env:
          CR_HOST: ${{ secrets.CR_HOST }}
          CR_REGISTRY: ${{ secrets.CR_REGISTRY }}
          CR_IMAGE: ${{ secrets.CR_IMAGE_CLIENT }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_DOMAIN=${{ secrets.VITE_API_DOMAIN }} \
            --build-arg VITE_TOKEN=${{ secrets.VITE_TOKEN }} \
            --build-arg VITE_SITE_URL=${{ secrets.VITE_SITE_URL }} \
            -t "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG" \
            -t "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:latest" \
            ./apps/client

          docker push "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG"
          docker push "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:latest"

  deploy:
    name: Deploy to Docker Swarm
    needs: [push-core, push-client]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest

    env:
      STACK_NAME: notes
      # Deploy the exact images this run built, not :latest — the swarm records
      # the tag in the service spec, which is what makes rollbacks meaningful.
      IMAGE_TAG: ${{ github.sha }}
      DOCKER_HOST: ssh://${{ secrets.SWARM_USER }}@${{ secrets.SWARM_HOST }}

    steps:
      - uses: actions/checkout@v4

      # The runner's registry credentials are forwarded to the swarm nodes by
      # --with-registry-auth below, so the VM needs no docker login of its own.
      - name: Yandex Cloud CR Login
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Set up SSH access to the swarm manager
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
          SWARM_SSH_KNOWN_HOSTS: ${{ secrets.SWARM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SWARM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -n "$SWARM_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SWARM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust-on-first-use fallback. Set SWARM_SSH_KNOWN_HOSTS to pin the
            # host key instead of re-learning it on every run.
            echo "::warning::SWARM_SSH_KNOWN_HOSTS is not set — falling back to ssh-keyscan"
            ssh-keyscan -H "$SWARM_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host $SWARM_HOST
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Check the swarm is reachable
        run: |
          docker version --format 'daemon {{.Server.Version}} on {{.Server.Os}}/{{.Server.Arch}}'
          if [ "$(docker info --format '{{.Swarm.ControlAvailable}}')" != 'true' ]; then
            echo "::error::${{ secrets.SWARM_HOST }} is not a swarm manager — run deploy/swarm/bootstrap.sh on it first"
            exit 1
          fi

      - name: Deploy the stack
        env:
          CR_HOST: ${{ secrets.CR_HOST }}
          CR_REGISTRY: ${{ secrets.CR_REGISTRY }}
          CR_IMAGE_CORE: ${{ secrets.CR_IMAGE_CORE }}
          CR_IMAGE_CLIENT: ${{ secrets.CR_IMAGE_CLIENT }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Имя БД лежит в POSTGRES_DB. Оно не секретное, поэтому может быть
          # заведено и как Actions variable — берём то, что найдётся.
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || vars.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REFRESH_JWT_SECRET: ${{ secrets.REFRESH_JWT_SECRET }}
          NOTES_YANDEX_ID: ${{ secrets.NOTES_YANDEX_ID }}
          NOTES_YANDEX_SECRET: ${{ secrets.NOTES_YANDEX_SECRET }}
          NOTES_YANDEX_REDIRECT: ${{ secrets.NOTES_YANDEX_REDIRECT }}
          NOTES_TARGET_URL: ${{ secrets.NOTES_TARGET_URL }}
          EMAILS: ${{ secrets.EMAILS }}
          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          SITE_URL: ${{ secrets.VITE_SITE_URL }}
          LOKI_HOST: ${{ secrets.LOKI_HOST }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_PORT: ${{ secrets.MINIO_PORT }}
          MINIO_USE_SSL: ${{ secrets.MINIO_USE_SSL }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NOTES: ${{ secrets.MINIO_BUCKET_NOTES }}
        run: |
          docker stack deploy \
            --compose-file deploy/swarm/notes-stack.yml \
            --with-registry-auth \
            --prune \
            "$STACK_NAME"

      - name: Wait for the rolling update to converge
        run: |
          services="${STACK_NAME}_notes-core ${STACK_NAME}_client"
          deadline=$(( $(date +%s) + 420 ))

          for svc in $services; do
            while :; do
              state=$(docker service inspect --format \
                '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}completed{{end}}' "$svc")
              replicas=$(docker service ls --filter "name=$svc" --format '{{.Replicas}}')

              case "$state" in
                completed|'')
                  # Converged only once the running count matches the desired one.
                  if [ -n "$replicas" ] && [ "${replicas%%/*}" = "${replicas##*/}" ]; then
                    echo "$svc: $replicas ($state)"
                    break
                  fi
                  ;;
                rollback_completed|rollback_started|paused)
                  echo "::error::$svc failed to update and swarm rolled it back (state: $state)"
                  docker service ps --no-trunc "$svc"
                  exit 1
                  ;;
              esac

              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::$svc did not converge in time (state: $state, replicas: $replicas)"
                docker service ps --no-trunc "$svc"
                exit 1
              fi
              sleep 5
            done
          done

      - name: Smoke test
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
        run: |
          # Hit the published ports from the VM itself: they are what the
          # reverse proxy in front of this host talks to. /rss.xml goes through
          # the client's nginx into core, so it covers the proxy wiring too.
          ssh "$SWARM_USER@$SWARM_HOST" '
            set -e
            for i in $(seq 1 20); do
              if curl -sf http://127.0.0.1:3450/api/v1/types > /dev/null \
                 && curl -sf http://127.0.0.1:3455/ > /dev/null \
                 && curl -sf http://127.0.0.1:3455/rss.xml > /dev/null; then
                echo "smoke test passed"
                exit 0
              fi
              sleep 3
            done
            echo "smoke test failed" >&2
            exit 1
          '

      # Runs only after the smoke test passed, so a broken deploy still has its
      # old images sitting on the node to roll back to.
      - name: Clean up old images on the swarm node
        env:
          CR_HOST: ${{ secrets.CR_HOST }}
          CR_REGISTRY: ${{ secrets.CR_REGISTRY }}
          CR_IMAGE_CORE: ${{ secrets.CR_IMAGE_CORE }}
          CR_IMAGE_CLIENT: ${{ secrets.CR_IMAGE_CLIENT }}
          KEEP_IMAGES: ${{ inputs.keep_images || '3' }}
        run: |
          # Scoped to this stack's own repositories on purpose. The node also
          # runs the ntlstl and rain stacks, and a blanket `docker image prune`
          # would strip their rollback targets too — swarm pins images by
          # digest, so their previous images sit there untagged and look
          # dangling.
          prune_repo() {
            repo="$1"
            svc="$2"

            all=$(docker images "$repo" --no-trunc --format '{{.ID}}' | sort -u)
            if [ -z "$all" ]; then
              echo "$repo: no images on the node"
              return 0
            fi

            # Whatever the live task actually runs, even if a rollback made an
            # older image the current one. Resolved through the container, not
            # through `docker ps --format {{.Image}}`: swarm pulls by digest, so
            # the tag that command prints often no longer resolves on the node.
            in_use=$(docker ps -q --filter "label=com.docker.swarm.service.name=$svc" \
              | xargs -r docker inspect --format '{{.Image}}' 2>/dev/null || true)

            # …plus the N newest, so `docker service rollback` does not have to
            # re-pull from the registry.
            recent=$(docker images "$repo" --no-trunc --format '{{.CreatedAt}}|{{.ID}}' \
              | sort -r | head -n "$KEEP_IMAGES" | cut -d'|' -f2)

            keep=$(printf '%s\n%s\n' "$in_use" "$recent" | grep . | sort -u) || true
            stale=$(comm -23 <(printf '%s\n' "$all") <(printf '%s\n' "$keep"))

            if [ -z "$stale" ]; then
              echo "$repo: nothing to remove (keeping $(printf '%s\n' "$keep" | wc -l) images)"
            else
              echo "$repo: removing $(printf '%s\n' "$stale" | wc -l) stale image(s):"
              # Per-image so one still-referenced image does not abort the rest.
              printf '%s\n' "$stale" | xargs -r -n1 docker image rm || true
            fi
          }

          prune_repo "$CR_HOST/$CR_REGISTRY/$CR_IMAGE_CORE"   "${STACK_NAME}_notes-core"
          prune_repo "$CR_HOST/$CR_REGISTRY/$CR_IMAGE_CLIENT" "${STACK_NAME}_client"

          docker system df

      # Opt-in: the registry is the copy that keeps costing money, but deleting
      # a tag is irreversible and takes away a rollback target the node may no
      # longer hold either. A Container Registry lifecycle policy does the same
      # job server-side and is the better long-term answer — see
      # deploy/swarm/README.md.
      - name: Clean up old tags in Container Registry
        if: ${{ inputs.prune_registry }}
        continue-on-error: true
        env:
          CR_REGISTRY: ${{ secrets.CR_REGISTRY }}
          CR_IMAGE_CORE: ${{ secrets.CR_IMAGE_CORE }}
          CR_IMAGE_CLIENT: ${{ secrets.CR_IMAGE_CLIENT }}
          KEEP_IMAGES: ${{ inputs.keep_images || '3' }}
          YC_SA_JSON: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            | bash -s -- -i "$HOME/yandex-cloud" -n
          export PATH="$HOME/yandex-cloud/bin:$PATH"

          printf '%s' "$YC_SA_JSON" > /tmp/sa-key.json
          yc config set service-account-key /tmp/sa-key.json

          prune_registry_repo() {
            # `yc` wants <registry-id>/<image> here — no `cr.yandex` host, it
            # parses the first path segment as the registry id and 404s on it.
            repo="$1"
            list=/tmp/stale-$(printf '%s' "$repo" | tr '/' '-').txt

            # Newest first; keep the N newest and anything tagged `latest` or
            # with the tag this run just deployed.
            yc container image list --repository-name "$repo" --format json \
              | jq -r --arg keep_tag "$IMAGE_TAG" --argjson keep "$KEEP_IMAGES" '
                  sort_by(.created_at) | reverse
                  | to_entries
                  | map(select(
                      .key >= $keep
                      and ((.value.tags // []) | index("latest") | not)
                      and ((.value.tags // []) | index($keep_tag) | not)
                    ))
                  | .[].value.id' \
              > "$list"

            count=$(wc -l < "$list")
            if [ "$count" -eq 0 ]; then
              echo "nothing to delete in $repo"
              return 0
            fi

            echo "deleting $count image(s) from $repo"
            while read -r id; do
              [ -n "$id" ] && yc container image delete "$id"
            done < "$list"
          }

          prune_registry_repo "$CR_REGISTRY/$CR_IMAGE_CORE"
          prune_registry_repo "$CR_REGISTRY/$CR_IMAGE_CLIENT"

      - name: Service state on failure
        if: failure()
        run: |
          docker stack ps --no-trunc "$STACK_NAME" || true
          docker service logs --tail 100 "${STACK_NAME}_notes-core" || true
          docker service logs --tail 100 "${STACK_NAME}_client" || true
